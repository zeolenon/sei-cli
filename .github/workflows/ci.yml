name: Tests and package

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      SEI_SESSION_PATH: ${{ runner.temp }}/sei-test/session.json
      SEI_CREDENTIALS_PATH: ${{ runner.temp }}/sei-test/credentials.json
      SEI_CREATED_PROCESSES_PATH: ${{ runner.temp }}/sei-test/created-processes.json
      SEI_CREATED_DOCUMENTS_PATH: ${{ runner.temp }}/sei-test/created-documents.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Run offline tests
        run: python -m pytest tests/ -q
      - name: Build source and wheel packages
        run: python -m build
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/sei-smoke"
          "$RUNNER_TEMP/sei-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sei-smoke/bin/sei" --version
          "$RUNNER_TEMP/sei-smoke/bin/sei" --help
